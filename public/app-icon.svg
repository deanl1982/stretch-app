<!--
  1024 master for rasterising. The clear space is baked in: platforms crop and
  pad icons, and without the padding the ground rule's tails are shaved off and
  the mark reads as a plain G.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#010736"/>
  <g transform="translate(192 192) scale(10)" fill="none" stroke="#FCF1D0"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 16 H16 V48 M48 48 V30 H34" stroke-width="7"/>
    <path d="M4 48 H60" stroke-width="10"/>
  </g>
</svg>
